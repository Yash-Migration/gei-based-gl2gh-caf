name: GitLab to GitHub Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT_NAME:
        description: "GitHub Environment name containing vars and secrets"
        type: string
        required: true
      INVENTORY_FILE:
        description: "GitLab Stats file generated using gitlab-stats gh extension"
        type: string
        default: "gitlab-stats.csv"
        required: true
      GITHUB_TYPE:
        description: "Allowed values are GitHub or GitHubDR"
        type: string
        default: "GitHub"
        required: true
      RUNNER_LABEL:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
        required: true

permissions:
  contents: read
  actions: read

# ------------------ Global Variables ------------------
env:
  DEBIAN_FRONTEND: "noninteractive"
  CI_PROJECT_DIR: ${{ github.workspace }}
  INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
  GITHUB_TYPE: ${{ inputs.GITHUB_TYPE }}

jobs:
  # ------------------ 0) Getting Environment Ready ------------------
  getting-env-ready:
    name: getting-env-ready
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GH_HOST: ${{ vars.GH_HOST }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: getting-env-ready
        shell: bash
        run: |
          echo "=============================="
          echo "# 0) Getting Environment Ready"
          echo "=============================="
          set -euo pipefail

          echo "[INFO] Checking OS version..."
          source /etc/os-release
          echo "OS: $PRETTY_NAME"

          if [[ "${ID:-}" != "ubuntu" ]]; then
            echo "[ERROR] Ubuntu is required. Current OS: $PRETTY_NAME"
            exit 1
          fi

          # Check sudo access
          HAS_SUDO="false"
          if sudo -n true >/dev/null 2>&1; then
            HAS_SUDO="true"
            echo "[INFO] User has sudo access."
          else
            echo "[INFO] User does NOT have sudo access."
          fi

          declare -a MISSING_PACKAGES=()
          declare -a ACTION_ITEMS=()

          echo "[INFO] Validating required CLI tooling..."
          declare -A REQUIRED_COMMANDS=(
            ["curl"]="curl"
            ["jq"]="jq"
            ["git"]="git"
            ["python3"]="python3"
          )

          for cmd in "${!REQUIRED_COMMANDS[@]}"; do
            package="${REQUIRED_COMMANDS[$cmd]}"
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "[INFO] $cmd detected: $($cmd --version | head -n1)"
            else
              echo "[WARN] $cmd is NOT installed."
              MISSING_PACKAGES+=("$package")
            fi
          done

          if [[ "${#MISSING_PACKAGES[@]}" -gt 0 ]]; then
            if [[ "$HAS_SUDO" == "true" ]]; then
              echo "[INFO] Installing missing packages..."
              sudo apt-get update -y
              sudo apt-get install -y "${MISSING_PACKAGES[@]}"
            else
              for pkg in "${MISSING_PACKAGES[@]}"; do
                ACTION_ITEMS+=("Install package: $pkg")
              done
            fi
          fi

          # Validate / Install GitHub CLI
          if command -v gh >/dev/null 2>&1; then
            echo "[INFO] GitHub CLI detected: $(gh --version | head -n1)"
          else
            if [[ "$HAS_SUDO" == "true" ]]; then
              echo "[INFO] Installing GitHub CLI..."
              sudo mkdir -p -m 755 /etc/apt/keyrings
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
                sudo dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
                sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
              sudo apt-get update -y
              sudo apt-get install -y gh
            else
              ACTION_ITEMS+=("Install GitHub CLI (gh)")
            fi
          fi

          if [[ "${#ACTION_ITEMS[@]}" -gt 0 && "$HAS_SUDO" != "true" ]]; then
            echo "[ERROR] Prerequisite validation failed. Actions required:"
            printf ' - %s\n' "${ACTION_ITEMS[@]}"
            exit 1
          fi

          # Authenticate and Install Extensions
          echo "[INFO] Installing GitHub CLI extensions..."
          [[ -n ${GH_PAT:-} ]] || { echo "[ERROR] GH_PAT is required"; exit 1; }
          [[ -n ${GH_HOST:-} ]] || { echo "[ERROR] GH_HOST is required"; exit 1; }

          unset GH_TOKEN
          echo "$GH_PAT" | gh auth login --with-token --hostname "$GH_HOST"

          gh auth status --hostname "$GH_HOST"

          gh extension install https://github.com/github/gh-gl2gh \
            || gh extension upgrade gh-gl2gh \
            || true

          gh extension install mona-actions/gh-gitlab-stats || gh extension upgrade gh-gitlab-stats || true

          # Install gh-gl2gh extension dependency binary
          echo "[INFO] Installing gl2gh tool binary..."
          gh gl2gh install || true

          echo "[INFO] Installed Extensions:"
          gh extension list

  # ------------------ 1) Validate Prerequisites ------------------
  validate-prerequisites:
    name: validate-prerequisites
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GH_HOST: ${{ vars.GH_HOST }}
      TARGET_API_URL: ${{ vars.TARGET_API_URL }}
      TARGET_UPLOADS_URL: ${{ vars.TARGET_UPLOADS_URL }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    needs: [getting-env-ready]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: validate-prerequisites
        shell: bash
        run: |
          echo "============================"
          echo "# 1) Validate Prerequisites"
          echo "============================"
          set -euo pipefail

          [[ -n ${SOURCE_GL_SERVER_URL:-} ]] || { echo "[ERROR] SOURCE_GL_SERVER_URL is required"; exit 1; }
          [[ -n ${GITLAB_API_PRIVATE_TOKEN:-} ]] || { echo "[ERROR] GITLAB_API_PRIVATE_TOKEN is required"; exit 1; }
          [[ -n ${GITLAB_USERNAME:-} ]] || { echo "[ERROR] GITLAB_USERNAME is required"; exit 1; }
          [[ -n ${GH_PAT:-} ]] || { echo "[ERROR] GH_PAT is required"; exit 1; }
          [[ -n ${GH_HOST:-} ]] || { echo "[ERROR] GH_HOST is required"; exit 1; }
          [[ -n ${TARGET_API_URL:-} ]] || { echo "[ERROR] TARGET_API_URL is required"; exit 1; }
          [[ -n ${TARGET_UPLOADS_URL:-} ]] || { echo "[ERROR] TARGET_UPLOADS_URL is required"; exit 1; }
          [[ -n ${INVENTORY_FILE:-} ]] || { echo "[ERROR] INVENTORY_FILE is required"; exit 1; }

          echo "Environment Variables Confirmed:"
          echo " - SOURCE_GL_SERVER_URL = $SOURCE_GL_SERVER_URL"
          echo " - GITLAB_USERNAME      = $GITLAB_USERNAME"
          echo " - INVENTORY_FILE       = $INVENTORY_FILE"
          echo " - GH_HOST              = $GH_HOST"
          echo " - TARGET_API_URL       = $TARGET_API_URL"
          echo " - TARGET_UPLOADS_URL   = $TARGET_UPLOADS_URL"

          echo "[INFO] Validating script availability..."
          test -f ./gl-migration-readiness-check.sh || { echo "[ERROR] gl-migration-readiness-check.sh not found"; exit 1; }
          test -f ./gl-gitsizer-readiness-check.sh || { echo "[ERROR] gl-gitsizer-readiness-check.sh not found"; exit 1; }
          test -f ./start-gl2gh-repo-migration.sh || { echo "[ERROR] start-gl2gh-repo-migration.sh not found"; exit 1; }
          test -f ./gl-post-migration-validation.sh || { echo "[ERROR] gl-post-migration-validation.sh not found"; exit 1; }

          [[ ! -s "$INVENTORY_FILE" ]] && echo "[ERROR] Inventory file missing or empty" && exit 1
          echo "[INFO] Validation complete."

  # ------------------ 2) Pre-Migration Readiness + GitSizer Check ------------------
  pre-migration-readiness-check:
    name: pre-migration-readiness-check
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GH_HOST: ${{ vars.GH_HOST }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
      GIT_SIZER_LARGE_FILE_THRESHOLD_BYTES: "419430400"
    needs: [validate-prerequisites]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Pre-Migration Readiness Check
        shell: bash
        run: |
          echo "======================================="
          echo "# Pre-Migration Readiness Check"
          echo "======================================="
          set -euo pipefail

          chmod +x ./gl-migration-readiness-check.sh ./gl-gitsizer-readiness-check.sh

          echo "# 1. Migration Readiness Check"
          ./gl-migration-readiness-check.sh 2>&1 | tee gl-migration-readiness-check.out

          # echo "# 2. GitSizer Check"
          # ./gl-gitsizer-readiness-check.sh 2>&1 | tee gl-gitsizer-readiness-check.out

      - name: Upload Readiness Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-migration-readiness-check-artifacts
          retention-days: 7
          path: |
            gl-migration-readiness-check.out
            gl-gitsizer-readiness-check.out
            logs/
            output_files/git-sizer-readiness/
            *.log

  # ------------------ 3) Manual Approval Gate ------------------
  approve-after-readiness-check:
    name: approve-after-readiness-check
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    needs: [pre-migration-readiness-check]
    environment:
      name: approvers-group
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pre-migration-readiness-check-artifacts
          path: .

      - name: Approval Notice
        shell: bash
        run: |
          echo "===================================="
          echo "MANUAL APPROVAL REQUIRED"
          echo "===================================="
          echo "Review readiness results and files above threshold before proceeding."

  # ------------------ 4) Start Repository Migration ------------------
  start-repository-migration:
    name: start-repository-migration
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GH_HOST: ${{ vars.GH_HOST }}
      TARGET_API_URL: ${{ vars.TARGET_API_URL }}
      TARGET_UPLOADS_URL: ${{ vars.TARGET_UPLOADS_URL }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    needs: [approve-after-readiness-check]
    outputs:
      MIGRATION_OUTPUT_FILE_BASENAME: ${{ steps.capture.outputs.MIGRATION_OUTPUT_FILE_BASENAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install/Update GEI Extension
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          unset GH_TOKEN
          echo "[INFO] Logging out of any existing GH CLI sessions..."
          gh auth logout --hostname "${GH_HOST:-}" || true
          gh auth logout --hostname github.com || true
      
          echo "[INFO] Authenticating to github.com for extension download..."
          echo "${GH_TOKEN}" | gh auth login --hostname $GH_HOST --with-token
      
          echo "[INFO] Installing gh-gl2gh extension from public GitHub..."
          gh extension install https://github.com/github/gh-gl2gh --force
      
          echo "[INFO] Verifying extension..."
          gh extension list
      
          echo "[INFO] Authenticating to target GitHub Enterprise..."
      
          if [[ -n "${GH_HOST:-}" ]]; then
            echo "${GH_PAT}" | gh auth login \
              --hostname "${GH_HOST}" \
              --with-token
          fi
      
          echo "[INFO] Verifying gh-gl2gh availability..."
          gh gl2gh version

      - name: Start Migration
        shell: bash
        run: |
          echo "====================="
          echo "# gl2gh Migrations"
          echo "====================="
          set -euo pipefail
          
          echo "[INFO] Installed Extensions:"
          gh extension list

          # Create log directories
          mkdir -p logs output_files logs/gl2gh-verbose-logs

          chmod +x ./start-gl2gh-repo-migration.sh
          
          echo "[INFO] Initiating direct GitLab-to-GitHub repository migrations..."
          ./start-gl2gh-repo-migration.sh 2>&1 | tee start-gl2gh-repo-migration.out

          MIGRATION_EXPORT="$(grep -E '^export[[:space:]]+MIGRATION_OUTPUT_FILE=' start-gl2gh-repo-migration.out || true)"
          [[ -n "$MIGRATION_EXPORT" ]] || { echo "[ERROR] MIGRATION_OUTPUT_FILE export line not found"; exit 1; }

          MIGRATION_OUTPUT_FILE="${MIGRATION_EXPORT#export MIGRATION_OUTPUT_FILE=}"
          echo "MIGRATION_OUTPUT_FILE=$MIGRATION_OUTPUT_FILE" > start-repository-migration-output-var.env
          
      - name: capture
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_OUTPUT_FILE="$(grep -E '^MIGRATION_OUTPUT_FILE=' start-repository-migration-output-var.env | head -n1 | cut -d= -f2-)"
          echo "MIGRATION_OUTPUT_FILE_BASENAME=$(basename "$MIGRATION_OUTPUT_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always() # Upload even if migration failed so you can inspect error logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: start-repository-migration-artifacts
          retention-days: 7
          path: |
            start-gl2gh-repo-migration.out
            start-repository-migration-output-var.env
            output_files/
            logs/**
            *.log

  # ------------------ 5) Display Migration Summary ------------------
  display-migration-summary:
    name: display-migration-summary
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    needs: [start-repository-migration]
    env:
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GH_HOST: ${{ vars.GH_HOST }}
      TARGET_API_URL: ${{ vars.TARGET_API_URL }}
      TARGET_UPLOADS_URL: ${{ vars.TARGET_UPLOADS_URL }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download readiness artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8 # v4.1.9
        with:
          name: pre-migration-readiness-check-artifacts
          path: .

      - name: Download migration artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8 # v4.1.9
        with:
          name: start-repository-migration-artifacts
          path: .

      - name: display-migration-summary
        shell: bash
        run: |
          SUMMARY_FILE="final-migration-summary.txt"

          {
            echo "==============================================="
            echo "# Migration Metrics Summary"
            echo "==============================================="
            set -euo pipefail

            START_OUT="start-gl2gh-repo-migration.out"

            get_last_num_for_key() {
              local file="$1" key="$2"
              awk -v k="$key" '
                BEGIN { v=0 }
                $0 ~ k {
                  for (i=1; i<=NF; i++) if ($i ~ /^[0-9]+$/) v=$i
                }
                END { print v+0 }
              ' "$file" 2>/dev/null || echo 0
            }

            start_total=$(get_last_num_for_key "$START_OUT" "Total")
            start_started=$(get_last_num_for_key "$START_OUT" "started")
            start_fail=$(get_last_num_for_key "$START_OUT" "Failed")

            echo "MIGRATION SUMMARY"
            echo "-----------------"
            printf "Start repository migrations : total=%s, started=%s, failed=%s\n" "$start_total" "$start_started" "$start_fail"

            if [ "$start_started" -eq 0 ]; then
              echo "[ERROR] No migrations were started. Review output_files/migration-failures_*.csv and logs."
              exit 1
            fi

            echo "============================================================"
            echo "# To Monitor Status (Optional / On-Demand)"
            echo "============================================================"
            echo "Run locally or via terminal:"
            echo "gh gei wait-for-migration --migration-id <ID> --github-target-pt $GH_PAT"
          } | tee "$SUMMARY_FILE"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1 # v4.6.2
        with:
          name: display-migration-summary-artifacts
          retention-days: 7
          path: |
            start-gl2gh-repo-migration.out
            final-migration-summary.txt
            output_files/
            logs/

  # ------------------ 6) Post-Migration Validation ------------------
  post-migration-validation:
    name: post-migration-validation
    runs-on: ["${{ inputs.RUNNER_LABEL }}"]
    environment: ${{ inputs.ENVIRONMENT_NAME }}
    env:
      GH_HOST: ${{ vars.GH_HOST }}
      INVENTORY_FILE: ${{ inputs.INVENTORY_FILE }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      SOURCE_GL_SERVER_URL: ${{ vars.SOURCE_GL_SERVER_URL }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
      GITLAB_API_PRIVATE_TOKEN: ${{ secrets.GITLAB_API_PRIVATE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    needs: [display-migration-summary]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Run Post Validation Script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gl-post-migration-validation.sh
          ./gl-post-migration-validation.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1 # v4.6.2
        with:
          name: post-migration-validation-artifacts
          retention-days: 7
          path: |
            output_files/
            logs/
